apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moji-ingress
  namespace: moji
  annotations:
    # Assumes nginx as ingress controller
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Websockets need this. Without it, the connection gets killed after 60s
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: moji.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moji-app
                port:
                  number: 80

